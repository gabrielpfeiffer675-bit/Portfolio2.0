<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Sécurisé — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #00e676;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            text-align: center;
            background: #141414;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            text-align: center;
            box-sizing: border-box;
        }
        input:focus { border-color: #00e676; outline: none; }
        button {
            background: linear-gradient(45deg, #00c853, #00b0ff);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        #error-msg { color: #ff5252; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>🔒 ACCÈS RESTREINT</h1>
        <p style="color: #a0a0a0; font-size: 0.9rem; margin-bottom: 20px;">Veuillez saisir le mot de passe pour consulter le portfolio.</p>
        
        <input type="password" id="password" placeholder="Mot de passe..." onkeydown="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">INITIALISER LA CONNEXION</button>
        
        <div id="error-msg"></div>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('password').value;
            const error = document.getElementById('error-msg');
            
            // Choisis ton mot de passe ici (ex: SIO2026)
            if (input === "SIO2026") {
                error.style.color = "#00e676";
                error.textContent = "Accès accordé. Redirection...";
                setTimeout(() => {
                    window.location.href = "portfolio.html";
                }, 1000);
            } else {
                error.textContent = "Mot de passe incorrect. Échec de l'authentification.";
            }
        }
    </script>
</body>
</html>
